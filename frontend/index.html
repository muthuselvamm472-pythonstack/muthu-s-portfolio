<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muthu Selvam | Python Full Stack Developer</title>
    <meta name="description" content="Personal Portfolio of Muthu Selvam - Python Full Stack Developer specializing in Python, Django REST Framework, React.js, and Relational Databases." />
    <!-- Google Fonts: Instrument Serif, Playfair Display (Serif Headings), Outfit (Body), JetBrains Mono (Accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Immediate theme application before DOM render to prevent preloader theme flash -->
    <script>
      (function() {
        try {
          var userTheme = localStorage.getItem('muthu_portfolio_theme_mode');
          var defaultTheme = localStorage.getItem('muthu_portfolio_default_theme');
          var theme = userTheme || defaultTheme || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
